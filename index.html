<!DOCTYPE html>
<html lang="en">
    <head>
        <title>POPCAT CLASSIC</title>
        <style>
            body {
                margin: 0;
                font-family: sans-serif;
                user-select: none;
            }
            .container {
                height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                background-color: #bdaa90;
            }
            .title {
                width: 80%;
                margin-top: 2em;
                max-width: 600px;
            }
            .cat-img {
                width: 100%;
                text-align: center;
                color: white;
                font-size: 80px;
                -webkit-text-stroke: 3px black;
                flex: 1;
                max-width: 800px;
            }
            #p {
                background-image: url('imgs/p.png');
                background-position: bottom;
                background-size: contain;
                background-repeat: no-repeat;
            }
            #p.open {
                background-image: url('imgs/op.png');
            }
        </style>
    </head>
    <body>
        <div class="container">
            <img class="title" src="imgs/popcat.svg" alt="POPCAT CLASSIC" >
            <div class="cat-img" id="p">0</div>
            
        </div>
        <div class="container" id="p2"></div>

        <!-- 音頻元素 -->
        <audio id="popSound" src="pops/pop1.mp3"></audio>

        <script>
            // 計數器初始化
            let count = 0;

            // 預載張嘴圖片 op.png
            const preloadImage = new Image();
            preloadImage.src = 'imgs/op.png';

            // 寫一個 function: 計數器累加
            function incrementCount() {
                count++;
                console.log(count); // 在 console 下面觀察 count 的變化
                document.getElementById('p').textContent = count;
            }

            // 當按下按鍵或滑鼠時，添加張嘴 class、播放音效並計數
            function handleDown() {
                const catElement = document.getElementById('p');
                catElement.classList.add('open');  // 使用 classList 添加 open class
                
                // 播放 pops/pop1.mp3
                const popSound = document.getElementById('popSound');
                popSound.currentTime = 0;  // 重置播放位置
                popSound.play();
                
                incrementCount();
            }

            // 當按鍵或滑鼠放開時，等待 25 毫秒後切換回閉嘴圖片
            function handleUp() {
                setTimeout(() => {
                    const catElement = document.getElementById('p');
                    catElement.classList.remove('open');  // 使用 classList 移除 open class
                }, 25);
            }

            // 為貓咪添加事件監聽
            const cat = document.getElementById('p');
            
            // 滑鼠事件
            cat.addEventListener('mousedown', handleDown);
            document.addEventListener('mouseup', handleUp);
            
            // 鍵盤事件 (除了滑鼠，也可以用鍵盤互動)
            document.addEventListener('keydown', (e) => {
                if (e.code === 'Space') {
                    e.preventDefault();
                    handleDown();
                }
            });
            document.addEventListener('keyup', (e) => {
                if (e.code === 'Space') {
                    e.preventDefault();
                    handleUp();
                }
            });
        </script>
    </body>
</html>
